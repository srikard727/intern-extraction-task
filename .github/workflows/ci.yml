name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests and audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check project configuration
        run: python scripts/check_project_config.py

      - name: Compile Python modules
        run: python -m compileall agent_rfq_extractor database scripts tests

      - name: Audit fixture outputs
        run: >-
          python scripts/audit_extraction_outputs.py
          --json outputs/rfq_extractions.json
          --db outputs/rfq_extractions.db
          --fixture-expectations

      - name: Validate browser output UI
        run: >-
          python scripts/validate_ui.py
          --db outputs/rfq_extractions.db
          --json outputs/rfq_extractions.json
          --fixture-expectations

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Validate Gmail credential override
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.gmail.yml
          config --quiet

      - name: Build API image
        run: docker build -t glass-rfq-extractor:ci .
